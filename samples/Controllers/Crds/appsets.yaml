apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appsets.samples.steeltoe.io
spec:
  group: samples.steeltoe.io
  scope: Namespaced
  names:
    plural: appsets
    singular: appset
    kind: AppSet
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 0
                image:
                  type: string
            status:
              type: object
              properties:
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                observedGeneration:
                  type: integer
